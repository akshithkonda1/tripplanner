name: Trippy
options:
  bundleIdPrefix: com.trippy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Trippy:
    type: application
    platform: iOS
    sources:
      - path: Trippy
    info:
      path: Config/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Trippy uses your location to show you on the trip map and find cheap fuel or transit nearby.
        NSLocationAlwaysAndWhenInUseUsageDescription: Trippy can keep the map current while you drive.
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trippy.app
      PRODUCT_NAME: Trippy
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: Config/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
